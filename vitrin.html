:root{
  --bg:#16130f; --card:#1e1a15; --line:#2c261e; --line-2:#3a332a;
  --ink:#efe7d8; --ink-2:#b3a892; --ink-3:#7d745f;
  --gold:#d4af37; --gold-soft:rgba(212,175,55,.14);
  --shadow:0 1px 6px rgba(0,0,0,.35); --shadow-lg:0 8px 26px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh}
button{cursor:pointer;background:none;border:0;color:inherit;font:inherit}
img{display:block}
.ust{max-width:1180px;margin:0 auto;padding:26px 20px 8px;display:flex;align-items:center;gap:14px}
.marka-yazi{width:210px;max-width:56vw;filter:invert(1) opacity(.9)}
.ust-sag{margin-left:auto;display:flex;align-items:center;gap:10px}
.est{font-size:10.5px;letter-spacing:.34em;color:var(--ink-3);text-transform:uppercase}
#dil{border:1px solid var(--line-2);border-radius:9px;padding:5px 11px;font-size:12px;letter-spacing:.06em;color:var(--ink-2)}
#dil:hover{color:var(--gold);border-color:var(--gold)}
.altbaslik{max-width:1180px;margin:0 auto;padding:4px 20px 14px;color:var(--ink-2);font-size:13px;letter-spacing:.05em}
.grid{max-width:1180px;margin:0 auto;padding:8px 20px 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 12px 70px}}
.kart{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;
  box-shadow:var(--shadow);transition:translate .12s ease, box-shadow .12s ease;display:flex;flex-direction:column}
.kart:hover{translate:0 -3px;box-shadow:var(--shadow-lg)}
.kgor{aspect-ratio:1/1;background:#0f0d0a;display:flex;align-items:center;justify-content:center;position:relative}
.kgor img{width:100%;height:100%;object-fit:contain}
.kmeta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.kno{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--gold);letter-spacing:.05em}
.ksan{font-weight:600;font-size:15px;line-height:1.3}
.ktek{font-size:12.5px;color:var(--ink-2)}
.kfiyat{margin-top:4px;font-size:14px;color:var(--gold);font-weight:600;letter-spacing:.02em}
.bos{max-width:640px;margin:60px auto;padding:0 20px;text-align:center;color:var(--ink-2);font-size:15px;line-height:1.7}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);
  width:min(920px,calc(100vw - 18px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);
  padding:0;overflow:auto;box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(8,6,4,.82)}
.d-ic{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media(max-width:760px){.d-ic{grid-template-columns:1fr}}
.d-gor{background:#0f0d0a;position:relative;min-height:290px;display:flex;align-items:center;justify-content:center}
.d-gor img{width:100%;height:100%;max-height:min(74vh,620px);object-fit:contain;touch-action:pan-y}
.kok{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:60px;color:#fff;font-size:26px;
  background:rgba(14,11,8,.45);display:flex;align-items:center;justify-content:center}
.kok:hover{background:rgba(14,11,8,.75)}
#onceki{left:0;border-radius:0 10px 10px 0}
#sonraki{right:0;border-radius:10px 0 0 10px}
.ksayac{position:absolute;right:10px;top:10px;font-size:11px;background:rgba(14,11,8,.6);color:#fff;border-radius:7px;padding:2px 8px}
.d-bilgi{padding:26px 26px 22px;display:flex;flex-direction:column;gap:8px}
.d-no{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--gold);letter-spacing:.08em}
.d-sanatci{font-size:23px;font-weight:700;line-height:1.2}
.d-tahmini{font-style:italic;color:var(--ink-2);font-size:14px}
.d-satir{font-size:14px;color:var(--ink-2);line-height:1.55}
.d-satir b{color:var(--ink);font-weight:600}
.d-fiyat{margin-top:10px;font-size:20px;color:var(--gold);font-weight:700}
.d-fiyat small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;letter-spacing:.05em;margin-top:2px}
.d-eylem{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.d-eylem a,.d-eylem button{border:1.5px solid var(--gold);color:var(--gold);border-radius:11px;padding:10px 18px;
  font-size:13.5px;letter-spacing:.04em;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.d-eylem a:hover,.d-eylem button:hover{background:var(--gold-soft)}
.d-yonetim{width:100%;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-yn{font-size:11px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.d-yonetim input{background:var(--bg);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;
  color:var(--ink);font-size:13px;outline:none;width:150px}
.d-yonetim input:focus{border-color:var(--gold)}
.d-yonetim button,.d-yonetim a{border:1px solid var(--line-2);color:var(--ink-2);border-radius:9px;
  padding:8px 12px;font-size:12px;text-decoration:none}
.d-yonetim button:hover,.d-yonetim a:hover{color:var(--gold);border-color:var(--gold)}
#dy-msg{font-size:12px;color:var(--ink-2)}
.d-kapat{position:sticky;top:10px;margin-left:auto;margin-right:10px;width:42px;height:42px;border-radius:50%;
  border:1.5px solid var(--gold);color:var(--gold);font-size:19px;background:var(--card);z-index:2;flex:none}
.dipnot{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--ink-3);font-size:11.5px;letter-spacing:.08em;text-align:center}
.yukleniyor{padding:80px 20px;text-align:center;color:var(--ink-2);letter-spacing:.08em}
</style>
</head>

async function vitrinGuncelle(no, alanlar){
  const g = await gh("contents/data/degisiklikler.json?ref=main");
  if(!g.ok) throw new Error("okuma " + g.status);
  const j = await g.json();
  const ham = atob(j.content.replace(/
/g, ""));
  const dizi = new Uint8Array(ham.length);
  for(let i = 0; i < ham.length; i++) dizi[i] = ham.charCodeAt(i);
  const veri = JSON.parse(new TextDecoder().decode(dizi));
  const d = veri.degisiklikler = veri.degisiklikler || {};
  const e = d[String(no)] = d[String(no)] || {};
  Object.assign(e, alanlar);
  e.guncelleme = new Date().toISOString();
  veri.gecmis_log = (veri.gecmis_log || []).concat([{t: e.guncelleme, kim: YONETICI || "?", no: no, tur: "vitrin", ozet: alanlar.vitrin === "" ? "vitrinden çıktı (vitrin sayfası)" : ("vitrin güncellendi" + (alanlar.vitrin_fiyat ? " · " + alanlar.vitrin_fiyat : ""))}]);
  veri.son = {t: e.guncelleme, kim: YONETICI || "?"};
  const r2 = await gh("contents/data/degisiklikler.json", {method: "PUT", body: JSON.stringify({message: "Vitrin sayfasi (" + YONETICI + "): " + no, content: b64u(JSON.stringify(veri)), branch: "main", sha: j.sha})});
  if(!r2.ok) throw new Error("yazma " + r2.status);
}

  let liste = vitrinNolar.map(kayitBul).filter(Boolean);
  if(onizle){

    if(r && liste.indexOf(r) < 0) liste = [r].concat(liste);

  if(!liste.length){
    $("grid").innerHTML = '<div class="bos">' +

  $("grid").innerHTML = liste.map(function(r){
    return '<button class="kart" type="button" data-no="' + r.no + '">' +
      '<div class="kgor"><img loading="lazy" decoding="async" src="k/' + r.no + '.jpg" alt=""></div>' +
      '<div class="kmeta"><span class="kno">№ ' + r.no + "</span>" +
      '<span class="ksan">' + (esc(r.sanatci) || esc(r.aciklama) || L("Eser", "Work")) + "</span>" +
      '<span class="ktek">' + [esc(cevir(r.teknik)), r.olcu ? esc(r.olcu) + " cm" : ""].filter(Boolean).join(" · ") + "</span>" +
